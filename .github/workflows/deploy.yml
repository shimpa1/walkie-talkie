name: Deploy

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the chart
        run: helm lint deploy/helm/firstmate

      - name: Render the chart
        run: |
          helm template firstmate deploy/helm/firstmate --namespace firstmate >/dev/null
          helm template firstmate deploy/helm/firstmate -n firstmate \
            -f deploy/helm/firstmate/examples/values-atus.yaml \
            --set credentials.create.walkieTalkieToken=tok \
            --set credentials.create.harness.DEEPSEEK_API_KEY=sk-xxx >/dev/null

      - name: Reserved harness credential names still fail closed
        run: |
          if helm template firstmate deploy/helm/firstmate -n firstmate \
            --set credentials.create.githubToken=x \
            --set credentials.create.harness.GH_TOKEN=y >/dev/null 2>&1; then
            echo "GH_TOKEN collision did not fail the render" >&2
            exit 1
          fi
          if helm template firstmate deploy/helm/firstmate -n firstmate \
            --set credentials.create.harness.walkie-talkie-token=x >/dev/null 2>&1; then
            echo "reserved credential key collision did not fail the render" >&2
            exit 1
          fi

      - name: Gateway off renders the same as before
        run: |
          chart=deploy/helm/firstmate
          atus=$chart/examples/values-atus.yaml
          # The atus values declare the whole gateway block with enabled: false;
          # it must render exactly what the same values render with the gateway
          # block reset to the chart defaults.
          helm template firstmate $chart -n firstmate -f "$atus" \
            --set credentials.create.walkieTalkieToken=tok >/tmp/off.yaml
          python3 -c 'import sys,re; s=open(sys.argv[1]).read(); open(sys.argv[2],"w").write(re.sub(r"(?ms)^gateway:\n.*", "", s))' "$atus" /tmp/atus-no-gateway.yaml
          helm template firstmate $chart -n firstmate -f /tmp/atus-no-gateway.yaml \
            --set credentials.create.walkieTalkieToken=tok >/tmp/baseline.yaml
          diff -u /tmp/baseline.yaml /tmp/off.yaml
          if grep -Eq 'firstmate-gateway|FM_WT_MODE' /tmp/off.yaml; then
            echo "gateway objects rendered while gateway.enabled is false" >&2
            exit 1
          fi

      - name: Gateway on renders the route switch and policies
        run: |
          helm template firstmate deploy/helm/firstmate -n firstmate \
            -f deploy/helm/firstmate/examples/values-atus.yaml \
            --set gateway.enabled=true --set gateway.githubClientId=Ov23liExample \
            --set credentials.create.walkieTalkieToken=tok >/tmp/on.yaml
          grep -Pzq 'kind: Service\n\s+name: firstmate-gateway\n\s+port: 8787' /tmp/on.yaml
          grep -q '^kind: Deployment$' /tmp/on.yaml
          grep -q 'name: firstmate-gateway-internal$' /tmp/on.yaml
          grep -q 'name: firstmate-gateway-data$' /tmp/on.yaml
          test "$(grep -c '^kind: NetworkPolicy$' /tmp/on.yaml)" -eq 2
          grep -Pzq 'name: FM_WT_GITHUB_CLIENT_SECRET\n\s+valueFrom:\n\s+secretKeyRef:' /tmp/on.yaml

      - name: Gateway inline secrets and missing admins fail closed
        run: |
          chart=deploy/helm/firstmate
          on="-f $chart/examples/values-atus.yaml --set gateway.enabled=true --set gateway.githubClientId=Ov23liExample"
          for bad in gateway.githubClientSecret=x gateway.secrets.githubClientSecret=x \
            gateway.vaultKeys=x gateway.legacyBearer.token=x; do
            if helm template firstmate $chart -n firstmate --set "$bad" >/dev/null 2>&1; then
              echo "inline secret $bad did not fail the render" >&2
              exit 1
            fi
          done
          if helm template firstmate $chart -n firstmate $on --set 'gateway.admins=null' >/dev/null 2>&1; then
            echo "gateway without admins did not fail the render" >&2
            exit 1
          fi

      - name: Per-user firstmates render their namespace, isolation and quota
        run: |
          chart=deploy/helm/firstmate
          helm template firstmate $chart -n firstmate -f $chart/examples/values-atus.yaml \
            --set gateway.enabled=true --set gateway.githubClientId=Ov23liExample \
            --set tenants.enabled=true \
            --set credentials.create.walkieTalkieToken=tok >/tmp/tenants.yaml
          python3 - /tmp/tenants.yaml <<'CHECK'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          def one(kind, name):
              found = [d for d in docs if d["kind"] == kind and d["metadata"]["name"] == name]
              assert len(found) == 1, f"{kind}/{name} renders once"
              return found[0]
          ns = one("Namespace", "firstmate-tenants")
          for mode in ("enforce", "audit", "warn"):
              assert ns["metadata"]["labels"][f"pod-security.kubernetes.io/{mode}"] == "restricted", mode
          hard = one("ResourceQuota", "firstmate-tenants")["spec"]["hard"]
          assert hard["pods"] == "5" and hard["requests.cpu"] == "1500m", hard
          one("LimitRange", "firstmate-tenants")
          rules = one("Role", "firstmate-gateway")["rules"]
          granted = {r: set(rule["verbs"]) for rule in rules for r in rule["resources"]}
          assert not any("/" in r or r == "*" for r in granted), granted
          assert "*" not in set().union(*granted.values()), granted
          one("RoleBinding", "firstmate-gateway")
          assert not [d for d in docs if d["kind"] in ("ClusterRole", "ClusterRoleBinding")]
          policies = [d for d in docs if d["kind"] == "NetworkPolicy" and d["metadata"].get("namespace") == "firstmate-tenants"]
          assert len(policies) == 3, [p["metadata"]["name"] for p in policies]
          deny = one("NetworkPolicy", "firstmate-tenants-default-deny")["spec"]
          assert deny["podSelector"] == {} and sorted(deny["policyTypes"]) == ["Egress", "Ingress"], deny
          blocks = [peer["ipBlock"] for rule in one("NetworkPolicy", "firstmate-tenants-egress")["spec"]["egress"]
                    for peer in rule["to"] if "ipBlock" in peer]
          v4 = [b for b in blocks if b["cidr"] == "0.0.0.0/0"]
          assert len(v4) == 1 and {"10.0.0.0/8", "169.254.0.0/16"} <= set(v4[0]["except"]), blocks
          CHECK
          # Off (the atus values as committed), none of it renders.
          helm template firstmate $chart -n firstmate -f $chart/examples/values-atus.yaml \
            --set credentials.create.walkieTalkieToken=tok >/tmp/tenants-off.yaml
          if grep -Eq 'firstmate-tenants|kind: (Role|RoleBinding|ResourceQuota|LimitRange|Namespace)$' /tmp/tenants-off.yaml; then
            echo "tenant objects rendered while tenants are off" >&2
            exit 1
          fi
          for bad in "--set tenants.enabled=true" \
            "-f $chart/examples/values-atus.yaml --set gateway.enabled=true --set gateway.githubClientId=x --set tenants.enabled=true --set gateway.networkPolicy.enabled=false"; do
            # shellcheck disable=SC2086 # the flags are word-split on purpose
            if helm template firstmate $chart -n firstmate $bad >/dev/null 2>&1; then
              echo "tenants rendered without their isolation: $bad" >&2
              exit 1
            fi
          done

      - name: Entrypoint harness-start test
        run: bash deploy/kubernetes/firstmate/entrypoint.test.sh
