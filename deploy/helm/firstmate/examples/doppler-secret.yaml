# Optional example: sync harness credentials from Doppler into a Kubernetes
# Secret with the Doppler Kubernetes operator.
#
# This is ONE optional secret source - not the default, and not required. The
# harness only reads plain environment variables, so any secret source works: a
# plain Secret created with `kubectl create secret generic`, External Secrets,
# sealed-secrets, a cloud secret manager, Doppler, and so on. The default
# documented path is a plain Kubernetes Secret consumed with
# `credentials.create.harness` (chart-managed) or `credentials.existingSecret`
# / `firstmate.extraEnvFrom` (managed elsewhere); see docs/deploy-kubernetes.md
# "Credentials".
#
# Use this only if you already run the Doppler operator
# (https://docs.doppler.com/docs/kubernetes-operator). Replace every
# angle-bracketed placeholder, apply the file, then point the chart at the
# managed Secret the operator creates:
#
#   credentials:
#     existingSecret: <managed-secret-name>
#     keys:
#       harness:
#         DEEPSEEK_API_KEY: DEEPSEEK_API_KEY
#
# or inject the whole Secret:
#
#   firstmate:
#     extraEnvFrom:
#       - secretRef:
#           name: <managed-secret-name>
#
# The operator token is never inlined here. It is read from a separate
# Kubernetes Secret named by tokenSecret; create that Secret yourself from a
# Doppler service token, for example:
#
#   kubectl -n <namespace> create secret generic <token-secret-name> \
#     --from-literal=serviceToken=<doppler-service-token>
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: <doppler-secret-resource-name>
  namespace: <namespace>
spec:
  tokenSecret:
    name: <token-secret-name>
    namespace: <namespace>
  project: <doppler-project>
  config: <doppler-config>
  managedSecret:
    name: <managed-secret-name>
    namespace: <namespace>
    type: Opaque
