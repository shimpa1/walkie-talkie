# Example values for the atus cluster: internet-facing NGINX Gateway API,
# StorageClass `beta3` (Rook-Ceph), TLS terminated at the shared Gateway with
# the wildcard `*.atus.hr` certificate.
#
# Fresh install:
#
#   helm upgrade --install firstmate deploy/helm/firstmate \
#     --namespace firstmate --create-namespace \
#     -f deploy/helm/firstmate/examples/values-atus.yaml \
#     --set credentials.create.walkieTalkieToken="$(openssl rand -hex 32)" \
#     --set credentials.create.githubToken=github_pat_xxx
#
# The atus deployment does not take harness/model credentials from `--set`: the
# Doppler operator syncs them into Secret `firstmate-doppler-secrets`, wired in
# as `firstmate.extraEnvFrom` below, where the default opencode harness reads
# DEEPSEEK_API_KEY / OPENROUTER_API_KEY (a Claude harness reads
# ANTHROPIC_API_KEY instead). Upgrading the live release therefore passes only
# the values file; the chart preserves the existing credential Secret and never
# re-supplies or rotates a credential unless one is explicitly passed.
#
# The runtime starts the primary harness in the herdr session and restarts it
# in the same pane if it exits, so the pod keeps a live firstmate draining
# queued instructions.

# Images. Published to Docker Hub as shimpa/<image> (the atus convention; the
# cluster pulls these without an imagePullSecret). Tags are immutable and
# build-specific: the firstmate runtime tag is the git commit the image was
# built from, and the walkie-talkie tag is reused unchanged while the app source
# is unchanged.
firstmate:
  image:
    repository: shimpa/firstmate-runtime
    # Commit a65e3c022457: the OpenCode watch-arm fix, so a freshly booted home
    # arms supervision and drains queued inbox notes with no task in flight. It
    # builds the pinned firstmate commit
    # c5f48e4cad279e6acaf14208522c44e28fac6835 (the commit the previous running
    # image b78d9d679e00 was also built from) plus the committed patches/ arm
    # patch. Built with:
    #   docker buildx build --platform linux/amd64 \
    #     -t shimpa/firstmate-runtime:a65e3c022457 --push deploy/kubernetes/firstmate
    tag: "a65e3c022457"
    pullPolicy: IfNotPresent
  home: /home/firstmate
  herdrSession: firstmate
  # Harness/model credentials for the atus deployment are synced into the
  # namespace by the Doppler operator (DopplerSecret doppler-firstmate ->
  # Secret firstmate-doppler-secrets), not committed here.
  extraEnvFrom:
    - secretRef:
        name: firstmate-doppler-secrets
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

walkieTalkie:
  image:
    repository: shimpa/walkie-talkie
    tag: "d1a06ce0a68b"
    pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClass: beta3
  size: 20Gi

service:
  type: ClusterIP
  port: 8787

# The shared atus Gateway lives in namespace nginx-gateway. Pin the HTTPS
# listener that serves the wildcard certificate (see
# cluster-resources/gateway.yaml in the atus deployment repo).
httpRoute:
  enabled: true
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: https-atus-wildcard
  hostnames:
    - walkie-talkie.atus.hr
  redirect:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: nginx-gateway
        sectionName: http

# TLS terminates at the Gateway using the existing wildcard certificate, so no
# cert-manager Certificate is created here.
certificate:
  enabled: false

credentials:
  # Either point at an existing Secret (recommended) or let the chart create
  # one. For a GitOps setup, prefer an existing Secret managed outside Helm.
  existingSecret: ""
  create:
    walkieTalkieToken: ""
    githubToken: ""
    # Pass harness credentials with --set (shown above) rather than committing
    # them here, e.g. DEEPSEEK_API_KEY / OPENROUTER_API_KEY for the default
    # opencode harness, or ANTHROPIC_API_KEY for a Claude harness.
    harness: {}

# Declarative agents: opencode is the harness, DeepSeek and OpenRouter are
# API-key providers, and the self-hosted Qwen on the atus 3090 box
# (10.4.0.20) is an OpenAI-compatible provider that needs no real key. Adding
# or removing an agent is a change to these values, not an image rebuild.
# Provider keys reach the container through the credential Secret:
#   credentials.create.harness.DEEPSEEK_API_KEY=... etc.
agents:
  enabled: true
  harnesses:
    - name: opencode
      env:
        - DEEPSEEK_API_KEY
        - OPENROUTER_API_KEY
  providers:
    - id: deepseek
      apiKeyEnv: DEEPSEEK_API_KEY
    - id: openrouter
      apiKeyEnv: OPENROUTER_API_KEY
    - id: local3090
      name: Local 3090 (Qwen3.8-27B)
      npm: "@ai-sdk/openai-compatible"
      baseURL: http://10.4.0.20:8000/v1
      models:
        qwen3.8-27b:
          name: Qwen3.8-27B (3090)
  # These profiles name only a harness, which is all the default (non-typed)
  # deployment needs. If you enable typed dispatch (TYPESAFE_API_KEY in
  # credentials.create.harness), every profile whose harness has no built-in
  # single-provider mapping - opencode here - must also set `provider` to your
  # quota-axi provider family (for example `provider: deepseek`), or firstmate
  # rejects the rules file as malformed. Leave typed dispatch off to keep these
  # profiles unchanged.
  dispatch:
    rules:
      - when: "Mechanical or routine implementation, or other work with a settled plan and a bounded path."
        use:
          - harness: opencode
            model: local3090/qwen3.8-27b
      - when: "Complex, ambiguous, or high-blast-radius work where the plan itself must be worked out."
        use:
          - harness: opencode
            model: deepseek/deepseek-flash
    default:
      - harness: opencode
        model: deepseek/deepseek-flash
