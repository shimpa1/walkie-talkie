# Example values for the atus cluster: internet-facing NGINX Gateway API,
# StorageClass `beta3` (Rook-Ceph), TLS terminated at the shared Gateway with
# the wildcard `*.atus.hr` certificate.
#
# Fresh install (the GitHub PAT is added to Doppler as key `GH_TOKEN`, not
# passed on the command line):
#
#   helm upgrade --install firstmate deploy/helm/firstmate \
#     --namespace firstmate --create-namespace \
#     -f deploy/helm/firstmate/examples/values-atus.yaml \
#     --set credentials.create.walkieTalkieToken="$(openssl rand -hex 32)"
#
# The atus deployment takes no credentials from `--set`: the Doppler operator
# syncs them into Secret `firstmate-doppler-secrets`, wired in as
# `firstmate.extraEnvFrom` below, where the default opencode harness reads
# DEEPSEEK_API_KEY / OPENROUTER_API_KEY (a Claude harness reads
# ANTHROPIC_API_KEY instead). The GitHub token for `gh` / `gh-axi` comes from the
# same Secret, not from the chart's own credential Secret: add a Doppler key
# named `GH_TOKEN` (its value is the PAT the captain owns) and `extraEnvFrom`
# injects it as the env var `GH_TOKEN`, while `firstmate.extraEnv` maps that same
# key to `GITHUB_TOKEN` for tools that read that name. `credentials.githubTokenEnabled`
# is false so the chart never sources a GitHub token from its own Secret and no
# token is ever committed. Upgrading the live release therefore passes only the
# values file; the chart preserves its credential Secret and never re-supplies or
# rotates a credential unless one is explicitly passed.
#
# The runtime starts the primary harness in the herdr session and restarts it
# in the same pane if it exits, so the pod keeps a live firstmate draining
# queued instructions.

# Images. Published to Docker Hub as shimpa/<image> (the atus convention; the
# cluster pulls these without an imagePullSecret). Tags are immutable and
# build-specific: each tag is the git commit its image was built from, reused
# unchanged while that image's source is unchanged.
firstmate:
  image:
    repository: shimpa/firstmate-runtime
    # Commit 6eb5b4543933: the runtime that starts a fresh harness when a
    # restart leaves a terminal-less herdr pane. It builds on e5c59151fbcd (the
    # note-draining runtime) and proves the pane's live terminal before trusting
    # its rehydrated idle agent, so a pod restart or rollout with a retained
    # volume no longer leaves the deployed firstmate idle with notes undrained:
    # it closes the restored husk, starts the harness in a fresh live pane, and
    # removes a watcher lock left naming a dead pid. The previous running image
    # was e5c59151fbcd. Built with:
    #   docker buildx build --platform linux/amd64 \
    #     -t shimpa/firstmate-runtime:6eb5b4543933 --push deploy/kubernetes/firstmate
    tag: "6eb5b4543933"
    pullPolicy: IfNotPresent
  home: /home/firstmate
  herdrSession: firstmate
  # Harness/model credentials and the GitHub token for the atus deployment are
  # synced into the namespace by the Doppler operator (DopplerSecret
  # doppler-firstmate -> Secret firstmate-doppler-secrets), not committed here.
  # The secret must carry a key named `GH_TOKEN` (value: the captain's GitHub
  # PAT). envFrom injects it as GH_TOKEN; the extraEnv entry below exposes the
  # same key as GITHUB_TOKEN for tools that read that name. optional:true keeps
  # the pod schedulable before the key exists, so a missing token surfaces as
  # `gh auth status` reporting logged-out rather than a crash-looping pod.
  extraEnvFrom:
    - secretRef:
        name: firstmate-doppler-secrets
  extraEnv:
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: firstmate-doppler-secrets
          key: GH_TOKEN
          optional: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

walkieTalkie:
  image:
    repository: shimpa/walkie-talkie
    # Commit d9702fc: main at the merge of PR #28, accurate firstmate state
    # (GET /api/firstmate, queued-note age and firstmate busy/idle/blocked/not
    # running, the Status-tab firstmate card). Deployed 2026-10-04. The previous
    # running image was e4dc8b5e7db3, built from commit e4dc8b5 (PR #26).
    # Built with:
    #   docker buildx build --platform linux/amd64 \
    #     -t shimpa/walkie-talkie:d9702fcbf9d9 --push .
    tag: "d9702fcbf9d9"
    pullPolicy: IfNotPresent
  # The Conversations view reads the pod's own herdr session through the herdr
  # CLI; the walkie-talkie image does not bundle it, so the chart installs it
  # from the pinned firstmate image into a shared volume at container start.
  herdrCLI:
    enabled: true

persistence:
  enabled: true
  storageClass: beta3
  size: 20Gi

service:
  type: ClusterIP
  port: 8787

# The shared atus Gateway lives in namespace nginx-gateway. Pin the HTTPS
# listener that serves the wildcard certificate (see
# cluster-resources/gateway.yaml in the atus deployment repo).
httpRoute:
  enabled: true
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: https-atus-wildcard
  hostnames:
    - walkie-talkie.atus.hr
  redirect:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: nginx-gateway
        sectionName: http

# TLS terminates at the Gateway using the existing wildcard certificate, so no
# cert-manager Certificate is created here.
certificate:
  enabled: false

credentials:
  # Either point at an existing Secret (recommended) or let the chart create
  # one. For a GitOps setup, prefer an existing Secret managed outside Helm.
  existingSecret: ""
  # GitHub auth comes from the Doppler-synced Secret (`extraEnvFrom` /
  # `extraEnv` above), so the chart must not also source a GH_TOKEN from its own
  # credential Secret.
  githubTokenEnabled: false
  create:
    walkieTalkieToken: ""
    githubToken: ""
    # Pass harness credentials with --set (shown above) rather than committing
    # them here, e.g. DEEPSEEK_API_KEY / OPENROUTER_API_KEY for the default
    # opencode harness, or ANTHROPIC_API_KEY for a Claude harness.
    harness: {}

# Declarative agents: opencode is the harness, and DeepSeek and OpenRouter are
# API-key providers. The routine tier routes to Qwen3.8-27B on OpenRouter
# (`qwen/qwen3.8-27b`), the same model the retired 3090 box self-hosted. Adding
# or removing an agent is a change to these values, not an image rebuild.
# Provider keys reach the container through the credential Secret:
#   credentials.create.harness.DEEPSEEK_API_KEY=... etc.
agents:
  enabled: true
  harnesses:
    - name: opencode
      env:
        - DEEPSEEK_API_KEY
        - OPENROUTER_API_KEY
  providers:
    - id: deepseek
      apiKeyEnv: DEEPSEEK_API_KEY
    - id: openrouter
      apiKeyEnv: OPENROUTER_API_KEY
  # These profiles name only a harness, which is all the default (non-typed)
  # deployment needs. If you enable typed dispatch (TYPESAFE_API_KEY in
  # credentials.create.harness), every profile whose harness has no built-in
  # single-provider mapping - opencode here - must also set `provider` to your
  # quota-axi provider family (for example `provider: deepseek`), or firstmate
  # rejects the rules file as malformed. Leave typed dispatch off to keep these
  # profiles unchanged.
  dispatch:
    rules:
      - when: "Mechanical or routine implementation, or other work with a settled plan and a bounded path."
        use:
          - harness: opencode
            model: openrouter/qwen/qwen3.8-27b
      - when: "Complex, ambiguous, or high-blast-radius work where the plan itself must be worked out."
        use:
          - harness: opencode
            model: deepseek/deepseek-flash
    default:
      - harness: opencode
        model: deepseek/deepseek-flash
