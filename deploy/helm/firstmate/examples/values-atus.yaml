# Example values for the atus cluster: internet-facing NGINX Gateway API,
# StorageClass `beta3` (Rook-Ceph), TLS terminated at the shared Gateway with
# the wildcard `*.atus.hr` certificate.
#
#   helm upgrade --install firstmate deploy/helm/firstmate \
#     --namespace firstmate --create-namespace \
#     -f deploy/helm/firstmate/examples/values-atus.yaml \
#     --set credentials.create.walkieTalkieToken="$(openssl rand -hex 32)" \
#     --set credentials.create.githubToken=github_pat_xxx \
#     --set credentials.create.harness.DEEPSEEK_API_KEY=sk-xxx \
#     --set credentials.create.harness.OPENROUTER_API_KEY=sk-or-xxx
#
# The harness credentials become environment variables in the firstmate
# container, where the primary harness reads them. The runtime image's default
# harness is opencode, which reads DEEPSEEK_API_KEY / OPENROUTER_API_KEY; a
# Claude harness reads ANTHROPIC_API_KEY instead.
#
# The runtime starts the primary harness in the herdr session and restarts it
# in the same pane if it exits, so the pod keeps a live firstmate draining
# queued instructions.

# Images. Build and push these to a registry the cluster can pull from, then
# replace the repositories (the defaults are local build names).
firstmate:
  image:
    repository: registry.atus.hr/firstmate-runtime
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  home: /home/firstmate
  herdrSession: firstmate
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

walkieTalkie:
  image:
    repository: registry.atus.hr/walkie-talkie
    tag: "0.1.0"
    pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClass: beta3
  size: 20Gi

service:
  type: ClusterIP
  port: 8787

# The shared atus Gateway lives in namespace nginx-gateway. Pin the HTTPS
# listener that serves the wildcard certificate (see
# cluster-resources/gateway.yaml in the atus deployment repo).
httpRoute:
  enabled: true
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: https-atus-wildcard
  hostnames:
    - walkie.atus.hr
  redirect:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: nginx-gateway
        sectionName: http

# TLS terminates at the Gateway using the existing wildcard certificate, so no
# cert-manager Certificate is created here.
certificate:
  enabled: false

credentials:
  # Either point at an existing Secret (recommended) or let the chart create
  # one. For a GitOps setup, prefer an existing Secret managed outside Helm.
  existingSecret: ""
  create:
    walkieTalkieToken: ""
    githubToken: ""
    # Pass harness credentials with --set (shown above) rather than committing
    # them here, e.g. DEEPSEEK_API_KEY / OPENROUTER_API_KEY for the default
    # opencode harness, or ANTHROPIC_API_KEY for a Claude harness.
    harness: {}

# Declarative agents: opencode is the harness, DeepSeek and OpenRouter are
# API-key providers, and the self-hosted Qwen on the atus 3090 box
# (10.4.0.20) is an OpenAI-compatible provider that needs no real key. Adding
# or removing an agent is a change to these values, not an image rebuild.
# Provider keys reach the container through the credential Secret:
#   credentials.create.harness.DEEPSEEK_API_KEY=... etc.
agents:
  enabled: true
  harnesses:
    - name: opencode
      env:
        - DEEPSEEK_API_KEY
        - OPENROUTER_API_KEY
  providers:
    - id: deepseek
      apiKeyEnv: DEEPSEEK_API_KEY
    - id: openrouter
      apiKeyEnv: OPENROUTER_API_KEY
    - id: local3090
      name: Local 3090 (Qwen3.8-27B)
      npm: "@ai-sdk/openai-compatible"
      baseURL: http://10.4.0.20:8000/v1
      apiKey: local
      models:
        qwen3.8-27b:
          name: Qwen3.8-27B (3090)
  dispatch:
    rules:
      - when: "Mechanical or routine implementation, or other work with a settled plan and a bounded path."
        use:
          - harness: opencode
            model: local3090/qwen3.8-27b
      - when: "Complex, ambiguous, or high-blast-radius work where the plan itself must be worked out."
        use:
          - harness: opencode
            model: deepseek/deepseek-flash
    default:
      - harness: opencode
        model: deepseek/deepseek-flash
