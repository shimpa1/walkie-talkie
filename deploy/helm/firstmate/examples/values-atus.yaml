# Example values for the atus cluster: internet-facing NGINX Gateway API,
# StorageClass `beta3` (Rook-Ceph), TLS terminated at the shared Gateway with
# the wildcard `*.atus.hr` certificate.
#
# Install or upgrade after OAuth registration and dedicated gateway secret
# sync (docs/operations.md). The GitHub PAT is added to Doppler as `GH_TOKEN`.
# A fresh install generates the static bearer; an upgrade preserves it:
#
#   helm upgrade --install firstmate deploy/helm/firstmate \
#     --namespace firstmate --create-namespace \
#     -f deploy/helm/firstmate/examples/values-atus.yaml
#
# The atus deployment takes no credentials from `--set`: the Doppler operator
# syncs them into Secret `firstmate-doppler-secrets`, wired in as
# `firstmate.extraEnvFrom` below, where the default opencode harness reads
# DEEPSEEK_API_KEY / OPENROUTER_API_KEY (a Claude harness reads
# ANTHROPIC_API_KEY instead). The GitHub token for `gh` / `gh-axi` comes from the
# same Secret, not from the chart's own credential Secret: add a Doppler key
# named `GH_TOKEN` (its value is the PAT the captain owns) and `extraEnvFrom`
# injects it as the env var `GH_TOKEN`, while `firstmate.extraEnv` maps that same
# key to `GITHUB_TOKEN` for tools that read that name. `credentials.githubTokenEnabled`
# is false so the chart never sources a GitHub token from its own Secret and no
# token is ever committed. Upgrading the live release therefore passes only the
# values file; the chart preserves its credential Secret and never re-supplies or
# rotates a credential unless one is explicitly passed.
#
# The runtime starts the primary harness in the herdr session and restarts it
# in the same pane if it exits, so the pod keeps a live firstmate draining
# queued instructions.

# Images. Published to Docker Hub as shimpa/<image> (the atus convention; the
# cluster pulls these without an imagePullSecret). Tags are immutable and
# build-specific: each tag is the git commit its image was built from, reused
# unchanged while that image's source is unchanged.
firstmate:
  image:
    repository: shimpa/firstmate-runtime
    # Commit 6eb5b4543933: the runtime that starts a fresh harness when a
    # restart leaves a terminal-less herdr pane. It builds on e5c59151fbcd (the
    # note-draining runtime) and proves the pane's live terminal before trusting
    # its rehydrated idle agent, so a pod restart or rollout with a retained
    # volume no longer leaves the deployed firstmate idle with notes undrained:
    # it closes the restored husk, starts the harness in a fresh live pane, and
    # removes a watcher lock left naming a dead pid. The previous running image
    # was e5c59151fbcd. Built with:
    #   docker buildx build --platform linux/amd64 \
    #     -t shimpa/firstmate-runtime:6eb5b4543933 --push deploy/kubernetes/firstmate
    tag: "6eb5b4543933"
    pullPolicy: IfNotPresent
  home: /home/firstmate
  herdrSession: firstmate
  # Harness/model credentials and the GitHub token for the atus deployment are
  # synced into the namespace by the Doppler operator (DopplerSecret
  # doppler-firstmate -> Secret firstmate-doppler-secrets), not committed here.
  # The secret must carry a key named `GH_TOKEN` (value: the captain's GitHub
  # PAT). envFrom injects it as GH_TOKEN; the extraEnv entry below exposes the
  # same key as GITHUB_TOKEN for tools that read that name. optional:true keeps
  # the pod schedulable before the key exists, so a missing token surfaces as
  # `gh auth status` reporting logged-out rather than a crash-looping pod.
  extraEnvFrom:
    - secretRef:
        name: firstmate-doppler-secrets
  extraEnv:
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: firstmate-doppler-secrets
          key: GH_TOKEN
          optional: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

walkieTalkie:
  image:
    repository: shimpa/walkie-talkie
    # Commit f81a7a4: main at the merge of PR #42 (raw cross-container health
    # diagnostics labeled as not observable from this container), which also
    # carries PR #41 (wide-screen layout from 720px up; phones unchanged).
    # Deployed 2026-10-07, the same image as gateway.image below. The previous
    # running image was 36ac8b81ad5b, built from commit 36ac8b8 (PR #30).
    # Built with:
    #   docker buildx build --platform linux/amd64 \
    #     -t shimpa/walkie-talkie:f81a7a42736e --push .
    tag: "f81a7a42736e"
    pullPolicy: IfNotPresent
  # The Conversations view reads the pod's own herdr session through the herdr
  # CLI; the walkie-talkie image does not bundle it, so the chart installs it
  # from the pinned firstmate image into a shared volume at container start.
  herdrCLI:
    enabled: true

persistence:
  enabled: true
  storageClass: beta3
  size: 20Gi

service:
  type: ClusterIP
  port: 8787

# The shared atus Gateway lives in namespace nginx-gateway. Pin the HTTPS
# listener that serves the wildcard certificate (see
# cluster-resources/gateway.yaml in the atus deployment repo).
httpRoute:
  enabled: true
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: https-atus-wildcard
  hostnames:
    - walkie-talkie.atus.hr
  redirect:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: nginx-gateway
        sectionName: http

# TLS terminates at the Gateway using the existing wildcard certificate, so no
# cert-manager Certificate is created here.
certificate:
  enabled: false

credentials:
  # Either point at an existing Secret (recommended) or let the chart create
  # one. For a GitOps setup, prefer an existing Secret managed outside Helm.
  existingSecret: ""
  # GitHub auth comes from the Doppler-synced Secret (`extraEnvFrom` /
  # `extraEnv` above), so the chart must not also source a GH_TOKEN from its own
  # credential Secret.
  githubTokenEnabled: false
  create:
    walkieTalkieToken: ""
    githubToken: ""
    # Static harness credentials come from firstmate-doppler-secrets above.
    # Keep real keys out of values files and Helm command arguments.
    harness: {}

# Declarative agents: opencode is the harness, and DeepSeek and OpenRouter are
# API-key providers. The routine tier routes to Qwen3.8-27B on OpenRouter
# (`qwen/qwen3.8-27b`), the same model the retired 3090 box self-hosted. Adding
# or removing an agent is a change to these values, not an image rebuild.
# Provider keys reach this static runtime through firstmate-doppler-secrets
# in firstmate.extraEnvFrom above, not the gateway Secret or user vault.
agents:
  enabled: true
  harnesses:
    - name: opencode
      env:
        - DEEPSEEK_API_KEY
        - OPENROUTER_API_KEY
  providers:
    - id: deepseek
      apiKeyEnv: DEEPSEEK_API_KEY
    - id: openrouter
      apiKeyEnv: OPENROUTER_API_KEY
  # These profiles name only a harness, which is all the default (non-typed)
  # deployment needs. If you enable typed dispatch (TYPESAFE_API_KEY in
  # credentials.create.harness), every profile whose harness has no built-in
  # single-provider mapping - opencode here - must also set `provider` to your
  # quota-axi provider family (for example `provider: deepseek`), or firstmate
  # rejects the rules file as malformed. Leave typed dispatch off to keep these
  # profiles unchanged.
  dispatch:
    rules:
      - when: "Mechanical or routine implementation, or other work with a settled plan and a bounded path."
        use:
          - harness: opencode
            model: openrouter/qwen/qwen3.8-27b
      - when: "Complex, ambiguous, or high-blast-radius work where the plan itself must be worked out."
        use:
          - harness: opencode
            model: deepseek/deepseek-flash
    default:
      - harness: opencode
        model: deepseek/deepseek-flash

# Multi-user gateway (docs/deploy-kubernetes.md, "Multi-user gateway"). On:
# the gateway runs its own Deployment in front of the firstmate pod and the
# HTTPRoute points at it. The firstmate StatefulSet above is unchanged by any
# of this: it becomes the admin's static tenant behind the gateway. Setting `enabled: false`
# and upgrading is the rollback; the gateway's store claim is kept.
gateway:
  enabled: true
  image:
    repository: shimpa/walkie-talkie
    # Commit f81a7a4: main at the merge of PR #42, the same image as the
    # sidecar above. The previous gateway image was b9c3cf045ff9 (PR #37).
    # Built with:
    #   docker buildx build --platform linux/amd64 \
    #     -t shimpa/walkie-talkie:f81a7a42736e --push .
    tag: "f81a7a42736e"
  # The registered GitHub OAuth App "walkie-talkie (atus)" (callback
  # https://walkie-talkie.atus.hr/auth/github/callback). The client id is
  # public; the client secret is only in Doppler (walkie-talkie/gateway).
  githubClientId: "Ov23litrgQH1slEFh7Ee"
  # shimpa1's GitHub numeric id.
  admins:
    - 20532068
  # Keep the installed phone working on its old token until it signs in with
  # GitHub; a follow-up values PR turns this off. The token is the chart's own
  # `firstmate-credentials` / `walkie-talkie-token`, the one the phone holds.
  legacyBearer:
    enabled: true
  # The captain's existing firstmate, routed to but not managed by the gateway.
  # The gateway presents the same walkie-talkie token to it.
  staticTenants:
    - githubId: 20532068
      upstream: http://firstmate.firstmate.svc.cluster.local:8787
      tokenSecretRef:
        name: firstmate-credentials
        key: walkie-talkie-token
  # A dedicated Doppler-synced Secret (DopplerSecret doppler-firstmate-gateway,
  # Doppler walkie-talkie/gateway -> Secret firstmate-gateway-secrets) carrying
  # WT_GITHUB_CLIENT_SECRET, WT_VAULT_KEYS and WT_TENANT_TOKEN_SECRET. Not
  # firstmate-doppler-secrets: the firstmate
  # container takes that whole Secret through envFrom, and these keys must reach
  # only the gateway.
  secrets:
    existingSecret: firstmate-gateway-secrets
  persistence:
    storageClass: beta3
    size: 1Gi

# Per-user firstmates (docs/deploy-kubernetes.md, "Per-user firstmates"). Off:
# enabling them is a separate deploy decision that needs the gateway on and the
# CNI NetworkPolicy check passed. Tenant homes use the same class. The
# 2026-10-06 check on atus found tenant egress NOT enforced: the cluster-wide
# Calico GlobalNetworkPolicy akash-guard-threatintel-egress-deny ends in an
# unconditional Allow that overrides every namespace's egress default-deny
# (ingress isolation is enforced). Do not enable tenants until that is fixed
# and the check passes (see "Check that the CNI enforces NetworkPolicy").
tenants:
  enabled: false
  image:
    # The runtime for per-user firstmates, which must fetch its credentials
    # from the gateway at start (entrypoint step 2c); the captain's firstmate
    # image above predates that. Commit b9c3cf0 (main at the merge of PR #37).
    # Inert while tenants are off. Built with:
    #   docker buildx build --platform linux/amd64 \
    #     -t shimpa/firstmate-runtime:b9c3cf045ff9 --push deploy/kubernetes/firstmate
    firstmate:
      repository: shimpa/firstmate-runtime
      tag: "b9c3cf045ff9"
  persistence:
    storageClass: beta3
  # atus pods resolve names through kubespray's node-local DNS cache, which
  # listens on 169.254.25.10 (inside the link-local range tenants may not
  # otherwise reach).
  networkPolicy:
    dns:
      extraCidrs:
        - 169.254.25.10/32
