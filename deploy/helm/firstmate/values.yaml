# Default values for the firstmate chart.
#
# The chart installs firstmate (running on its herdr session backend) together
# with the walkie-talkie companion service into one cluster. Nothing about any
# particular cluster is baked in: images, storage class, gateway, hostname,
# TLS, credentials and the firstmate home path are all values here. Replace
# them for your cluster; see docs/deploy-kubernetes.md and
# examples/values-atus.yaml.

# Override the chart name or the generated resource name prefix.
nameOverride: ""
fullnameOverride: ""

# Pull secrets for private image registries.
imagePullSecrets: []

# ---------------------------------------------------------------------------
# firstmate container
# ---------------------------------------------------------------------------
firstmate:
  image:
    # Build this image from deploy/kubernetes/firstmate/Dockerfile, or point at
    # your own firstmate runtime image.
    repository: firstmate-runtime
    # Defaults to .Chart.AppVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent

  # Absolute path inside the container that is the firstmate home (the cloned
  # distro plus state, data, projects and config). The StatefulSet mounts its
  # persistent volume here. Both containers share it.
  home: /home/firstmate

  # Named herdr session the runtime uses and that you attach to. firstmate
  # reads it from HERDR_SESSION and the entrypoint starts the headless server
  # for it.
  herdrSession: firstmate

  # Command that starts firstmate's primary harness inside the herdr session at
  # container start. The entrypoint supervises it and starts it again in the
  # same pane when it exits, so the pod runs a live firstmate that drains queued
  # instructions rather than only the herdr server. The default matches the
  # runtime image's default harness (opencode), auto-approves its tool calls
  # (which an unattended primary needs), and opens with firstmate's session-start
  # prompt: a bare opencode TUI does not create a session until it receives a
  # first prompt, so without one firstmate never starts. `FM_PRIMARY_SESSION_START_PROMPT`
  # is exported by the entrypoint and inherited by the pane; the entrypoint also
  # removes firstmate's tracked session-start nudge plugin from the home, so this
  # opening prompt is the only delivery and the model never runs the startup
  # sweeps twice. Override this for another harness or a different posture; keep
  # an initial prompt so the pod runs firstmate rather than an idle TUI. Set it
  # empty to run the herdr server only and start the harness yourself after
  # attaching. Harness credentials are passed to it through
  # `credentials.create.harness` (or an existing Secret), which become
  # environment variables in this container.
  harnessCommand: >-
    OPENCODE_CONFIG_CONTENT='{"permission":{"*":"allow"}}' opencode --prompt "$FM_PRIMARY_SESSION_START_PROMPT"

  # Extra environment variables for the firstmate container. Harness and model
  # credentials belong under `credentials`, not here.
  extraEnv: []
  #  - name: ANTHROPIC_BASE_URL
  #    value: https://example.invalid

  # Extra environment variables sourced from Secrets or ConfigMaps.
  extraEnvFrom: []
  #  - secretRef:
  #      name: my-harness-config
  #
  # To take the GitHub token from an external Secret (for example a
  # Doppler-synced Secret) instead of the chart's credential Secret, carry a key
  # named `GH_TOKEN` in that Secret so `extraEnvFrom` injects it as GH_TOKEN, map
  # the same key to GITHUB_TOKEN with an `extraEnv` secretKeyRef if a tool needs
  # that name, and set `credentials.githubTokenEnabled: false` so the chart does
  # not also source a token from its own Secret. See examples/values-atus.yaml.
  #  - name: GITHUB_TOKEN
  #    valueFrom:
  #      secretKeyRef:
  #        name: my-doppler-secrets
  #        key: GH_TOKEN
  #        optional: true

  # Override the image entrypoint if you ship your own image.
  command: []
  args: []

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  # Pod-security settings are intentional defaults; change them to match your
  # cluster's Pod Security Admission level and the user that owns the volume.
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# walkie-talkie container (the phone companion PWA + API)
# ---------------------------------------------------------------------------
walkieTalkie:
  image:
    # Built from the repository-root Dockerfile provided by the sibling
    # Docker/Compose deploy slice (a prerequisite; merge it first), or point at
    # your own built image.
    repository: walkie-talkie
    tag: ""
    pullPolicy: IfNotPresent

  # The Conversations live-session list reads this pod's own herdr session with
  # the read-only `herdr` CLI. The walkie-talkie image does not bundle herdr, so
  # when enabled the chart runs an init container from `firstmate.image` (which
  # provides the pinned herdr build) that copies the binary into a shared
  # emptyDir and mounts it into the walkie-talkie container. It then sets
  # `FM_WT_HERDR_BIN` to that path and `XDG_CONFIG_HOME` to the shared firstmate
  # home's `.config`, so the CLI finds the session socket under the mounted home
  # rather than the container's own HOME. `HERDR_SESSION` already reaches both
  # containers via the chart ConfigMap. Status, instruction threads, and push
  # work without this.
  herdrCLI:
    enabled: false
    # Absolute directory mounted into the walkie-talkie container that holds the
    # installed binary, and the binary's file name under it. A trailing slash on
    # mountPath is ignored. Change these only to avoid a collision with a path
    # in your own image.
    mountPath: /opt/herdr
    binary: herdr

  # Port the service listens on inside the container.
  port: 8787

  extraEnv: []
  extraEnvFrom: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Probes. Liveness is a plain TCP check so a unhealthy firstmate does not
  # restart the web tier; readiness asks firstmate whether it is ready.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Persistence: the firstmate home
# ---------------------------------------------------------------------------
persistence:
  # Create a volumeClaimTemplate on the StatefulSet. When false, you must set
  # `existingClaim` (or the pod will use an emptyDir, which loses state).
  enabled: true
  # StorageClass for the claim. Leave empty to use the cluster's default
  # StorageClass. `beta3` is the atus cluster's Rook-Ceph class and belongs only
  # in examples/values-atus.yaml, not the generic chart default.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  # Use an already-created PVC instead of a volumeClaimTemplate. Requires
  # `enabled: false`; setting it while `enabled: true` fails the render.
  existingClaim: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Service + Gateway API routing
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  # Port exposed by the Service; routes to walkie-talkie's container port.
  port: 8787
  annotations: {}

# The HTTPRoute attaches to this Gateway (gateway.networking.k8s.io/v1). TLS
# terminates at the Gateway; the chart never exposes anything else publicly.
httpRoute:
  enabled: true
  # One entry per Gateway listener. Multiple parents are allowed.
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      # Leave empty to attach to every listener on the Gateway whose hostname
      # matches; set it to pin a specific listener, e.g. https-atus-wildcard.
      sectionName: ""
  # Hostnames routed to walkie-talkie.
  hostnames:
    - firstmate.example.com
  annotations: {}
  # Add an HTTP listener route that 301-redirects to HTTPS.
  redirect:
    enabled: false
    parentRefs:
      - name: gateway
        namespace: nginx-gateway
        sectionName: http

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
# TLS terminates at the Gateway for the normal case. The chart does not create
# the Gateway's TLS secret. Enable `certificate` only when this namespace
# terminates its own TLS with cert-manager.
certificate:
  enabled: false
  secretName: firstmate-tls
  issuerRef:
    name: ""
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames: []
  duration: ""
  renewBefore: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
# Nothing is inlined into the workload: every credential reaches a container
# through a Secret with secretKeyRef. Either point at an existing Secret
# (recommended for GitOps and external secret operators) or let the chart
# create one from the values below.
credentials:
  # Name of a pre-created Secret. When set, the chart creates no Secret and
  # reads the keys below from it; the pods cannot start until it exists.
  existingSecret: ""

  # Inject GH_TOKEN/GITHUB_TOKEN into the firstmate container from the Secret.
  # Set false when your existing Secret carries no GitHub key.
  githubTokenEnabled: true

  # Created-Secret mode: used only when existingSecret is empty.
  # Do not commit real tokens to values.yaml; pass them with --set or a sealed
  # secret / external secret operator.
  create:
    # Bearer token the phone uses under Settings. If left empty the chart
    # generates one and preserves it across upgrades; set it to control it.
    walkieTalkieToken: ""
    # Token for the GitHub CLI inside the firstmate container.
    githubToken: ""
    # Harness/model credentials: map of environment-variable name to value.
    # Each becomes an environment variable in the firstmate container, where
    # the primary harness reads it (for the default opencode harness, e.g.
    # DEEPSEEK_API_KEY or OPENROUTER_API_KEY; for a Claude harness,
    # ANTHROPIC_API_KEY). A name that collides with a reserved name makes the
    # chart fail at render instead of silently overwriting the built-in
    # credential: the `walkieTalkieToken`/`githubToken` key names (see
    # `keys`) and the `GH_TOKEN`/`GITHUB_TOKEN` env names are all reserved.
    harness: {}

  # Secret key names. `create` writes these keys; with `existingSecret` these
  # are the keys the chart reads.
  keys:
    walkieTalkieToken: walkie-talkie-token
    githubToken: github-token
    # Map of environment-variable name to key in the existing Secret, e.g.
    # `DEEPSEEK_API_KEY: deepseek-api-key` or
    # `ANTHROPIC_API_KEY: anthropic-api-key`. Ignored in created-Secret mode
    # (the env-var name is the key there). The env names
    # `GH_TOKEN`/`GITHUB_TOKEN` are reserved and make the chart fail at render
    # if reused here.
    harness: {}

# ---------------------------------------------------------------------------
# Agent configuration: which harnesses, providers/models, and per-task
# dispatch defaults the deployed firstmate may use.
# ---------------------------------------------------------------------------
# When `enabled`, the chart renders a ConfigMap and mounts it into the
# firstmate home so no image rebuild is needed to add or remove an agent:
#   * <home>/.config/opencode/opencode.json  the provider/model catalog the
#     opencode harness reads (its global config);
#   * <home>/config/crew-dispatch.json       firstmate's per-task dispatch
#     profiles that choose a harness and model.
# Authorization env vars are still delivered through the credential Secret
# (credentials.create.harness / credentials.keys.harness); `harnesses[].env`
# declares the names and the chart fails the render if a provider references
# an undeclared one. See docs/deploy-kubernetes.md.
agents:
  enabled: false

  # Harnesses firstmate may launch, and the env vars that authorize each. The
  # harness executable must already exist in the runtime image (the
  # HARNESS_PACKAGES build arg); this declares which are usable and how.
  # Every dispatch profile's `harness` must be declared here.
  harnesses: []
  #  - name: opencode
  #    env:
  #      - DEEPSEEK_API_KEY
  #      - OPENROUTER_API_KEY

  # Provider/model catalog rendered to the opencode global config. Any
  # models.dev provider id or OpenAI-compatible endpoint can be declared, so
  # no vendor is baked in.
  #   id       (required) provider id, e.g. deepseek, openrouter
  #   name     display name
  #   npm      provider package, e.g. "@ai-sdk/openai-compatible"
  #   baseURL  OpenAI-compatible endpoint base URL
  #   apiKeyEnv  env var name for the key; the value comes from the credential
  #              Secret and must be declared under some harnesses[].env. A
  #              provider that needs no key (a local OpenAI-compatible server)
  #              omits it.
  #   models   map of model id to model config (name and any provider fields)
  #   options  extra provider options passed through, except `apiKey`; declare
  #              the key with apiKeyEnv instead
  providers: []
  #  - id: deepseek
  #    apiKeyEnv: DEEPSEEK_API_KEY
  #  - id: openrouter
  #    apiKeyEnv: OPENROUTER_API_KEY

  # firstmate's per-task dispatch profiles (its crew-dispatch schema): `rules`
  # with natural-language `when` and `use` profiles, plus an optional `default`
  # profile array (or a single profile object; a rule's `use` takes either form
  # too). Each profile names a declared harness and an optional model as
  # "<provider>/<model-id>".
  #
  # A profile needs only `harness` for the default, non-typed deployment. When
  # typed dispatch is enabled (TYPESAFE_API_KEY), firstmate additionally
  # requires `provider` on every profile whose harness has no built-in
  # single-provider mapping - opencode, pi, pi-signed, and omp - naming the
  # quota-axi provider family; otherwise it rejects the rules file as malformed.
  # Harnesses with a built-in mapping (claude, codex, grok, kimi, cursor, agy,
  # muse) need no provider.
  dispatch: {}
  #  rules:
  #    - when: "Mechanical or routine implementation along an existing pattern."
  #      use:
  #        - harness: opencode
  #          model: openrouter/qwen/qwen3.8-27b
  #  default:
  #    - harness: opencode
  #      model: deepseek/deepseek-chat

# ---------------------------------------------------------------------------
# Pod scheduling and identity
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# Optional default-deny network policy for the namespace's ingress, allowing
# only the Gateway namespace to reach walkie-talkie. Disabled by default
# because kubelet probe traffic handling varies by CNI.
networkPolicy:
  enabled: false
  # Namespace the Gateway lives in. When empty, uses the first httpRoute
  # parentRef namespace.
  gatewayNamespace: ""

# ---------------------------------------------------------------------------
# Multi-user gateway (walkie-talkie in FM_WT_MODE=gateway)
# ---------------------------------------------------------------------------
# When enabled, the chart adds a separate gateway workload in front of the
# firstmate pod: people sign in with GitHub, and the gateway forwards each
# signed-in user's API calls only to that user's own firstmate. The HTTPRoute
# then points at the gateway instead of the firstmate Service, and network
# policies let only the gateway reach the firstmate pod's walkie-talkie port.
# The firstmate StatefulSet, its volume, images and agents config are not
# touched: the existing pod becomes a "static tenant" the gateway routes to.
# Disabled, none of this renders and the chart output is exactly as before.
# See "Multi-user gateway" in docs/deploy-kubernetes.md for the GitHub OAuth App,
# the secrets, the cutover and rollback.
gateway:
  enabled: false

  # The gateway runs the walkie-talkie image in gateway mode. Empty repository
  # or tag fall back to walkieTalkie.image, but the image must be a build that
  # includes gateway mode, so pin it explicitly when the firstmate pod's sidecar
  # stays on an older build.
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # The https origin people open, e.g. https://walkie-talkie.example.com. The
  # GitHub OAuth callback and the CSRF origin check use it. Empty derives it
  # from the first httpRoute hostname.
  publicOrigin: ""

  # Client id of the GitHub OAuth App (public, so it lives here). Its client
  # secret never does: see `secrets`. Required when enabled.
  githubClientId: ""

  # GitHub numeric ids that hold the admin role. Declared here and nowhere else;
  # adding or removing an admin is a reviewed values change. At least one is
  # required when enabled. Find an id with `gh api users/<login> --jq .id`.
  admins: []

  # Uninvited GitHub sign-ins become capped access requests the admin approves
  # or denies. false is strict invite-only: they are refused and nothing is
  # recorded.
  accessRequests:
    enabled: true

  # Migration bridge: while enabled, the gateway accepts the old shared bearer
  # token from a browser as the first declared admin, so an installed phone keeps
  # working the moment the HTTPRoute moves to the gateway. Turn it off once every
  # device has signed in with GitHub. The token comes from `tokenSecretRef`;
  # leaving its name empty uses the chart's own credential Secret and the
  # `credentials.keys.walkieTalkieToken` key, which is the token the phone holds.
  legacyBearer:
    enabled: false
    tokenSecretRef:
      name: ""
      key: ""

  # Firstmates the gateway routes to but does not manage: each maps one GitHub
  # numeric id to a walkie-talkie upstream and the bearer token that upstream
  # accepts, read from an existing Secret (never inline). The chart's own
  # firstmate pod is one:
  #  - githubId: 20532068
  #    upstream: http://firstmate.firstmate.svc.cluster.local:8787
  #    tokenSecretRef:
  #      name: firstmate-credentials
  #      key: walkie-talkie-token
  staticTenants: []

  # Secret values reach the gateway only through secretKeyRef from an existing
  # Secret, for example one the Doppler operator syncs. The chart has no field
  # for an inline value and fails the render if one is given. Use a Secret that
  # is not also injected wholesale into the firstmate container (envFrom), so the
  # agent never sees these keys. Required when enabled.
  secrets:
    existingSecret: ""
    keys:
      # GitHub OAuth App client secret.
      githubClientSecret: WT_GITHUB_CLIENT_SECRET
      # Credential vault keyring, "k1:<base64 32 bytes>[,k2:...]" (FM_WT_VAULT_KEYS).
      vaultKeys: WT_VAULT_KEYS
      # Master secret the per-tenant internal tokens derive from
      # (FM_WT_TENANT_TOKEN_SECRET).
      tenantTokenSecret: WT_TENANT_TOKEN_SECRET

  # Id of the keyring entry new credentials are encrypted under
  # (FM_WT_VAULT_ACTIVE_KEY). Not secret.
  vault:
    activeKey: k1

  # Reverse-proxy hops in front of the gateway whose X-Forwarded-For entries are
  # trusted for per-client rate limits. 1 fits a Gateway that appends the client
  # address; 0 trusts none and keys limits on the peer address.
  trustedProxyHops: 1

  # Public port (the web app, sign-in and the forwarded API) and the internal
  # port that per-user firstmates fetch their credentials from. The internal
  # port is never on the HTTPRoute.
  port: 8787
  internalPort: 8788
  service:
    type: ClusterIP
    port: 8787
    internalPort: 8788
    annotations: {}

  # Namespace whose pods may reach the internal port (per-user firstmates).
  tenantNamespace: firstmate-tenants

  # The gateway's own SQLite store: users, sessions, invites and the audit log.
  # A small ReadWriteOnce claim mounted only by the gateway. It is kept when the
  # gateway is disabled or the release uninstalled, so turning the gateway off
  # and on again keeps its users.
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations: {}

  # When enabled with the gateway: the gateway accepts its public port only from
  # the Gateway namespace and its internal port only from `tenantNamespace`, and
  # the firstmate pod accepts its walkie-talkie port only from the gateway. This
  # replaces the plain `networkPolicy` above while the gateway is on. Needs a CNI
  # that enforces NetworkPolicy and lets kubelet probes through.
  networkPolicy:
    enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
