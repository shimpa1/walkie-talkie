apiVersion: v1
kind: Service
metadata:
  name: {{ include "firstmate.headlessServiceName" . }}
  labels:
    {{- include "firstmate.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: walkie-talkie
      port: {{ .Values.service.port }}
      targetPort: walkie-talkie
      protocol: TCP
  selector:
    {{- include "firstmate.selectorLabels" . | nindent 4 }}
