{{- if .Values.gateway.enabled }}
# The gateway's own identity, separate from the firstmate pod's. It mounts no
# token and is granted no API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "firstmate.gateway.fullname" . }}
  labels:
    {{- include "firstmate.gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
