{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firstmate.gateway.fullname" . }}
  labels:
    {{- include "firstmate.gateway.labels" . | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "firstmate.gateway.selectorLabels" . | nindent 4 }}
---
# Credential delivery to per-user firstmates. Cluster-internal only: never a
# backend of the HTTPRoute.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firstmate.gateway.fullname" . }}-internal
  labels:
    {{- include "firstmate.gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: internal
      port: {{ .Values.gateway.service.internalPort }}
      targetPort: internal
      protocol: TCP
  selector:
    {{- include "firstmate.gateway.selectorLabels" . | nindent 4 }}
{{- end }}
