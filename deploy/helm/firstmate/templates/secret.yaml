{{- if not .Values.credentials.existingSecret -}}
{{- $secretName := include "firstmate.secretName" . -}}
{{- $tokenKey := .Values.credentials.keys.walkieTalkieToken -}}
{{- $token := .Values.credentials.create.walkieTalkieToken -}}
{{- if not $token -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing $existing.data (index $existing.data $tokenKey) -}}
{{- $token = index $existing.data $tokenKey | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "firstmate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $tokenKey }}: {{ $token | quote }}
  {{- if .Values.credentials.create.githubToken }}
  {{ .Values.credentials.keys.githubToken }}: {{ .Values.credentials.create.githubToken | quote }}
  {{- end }}
  {{- range $env, $value := .Values.credentials.create.harness }}
  {{ $env }}: {{ $value | quote }}
  {{- end }}
{{- end }}
