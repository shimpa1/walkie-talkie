{{- if not .Values.credentials.existingSecret -}}
{{- $secretName := include "firstmate.secretName" . -}}
{{- $tokenKey := .Values.credentials.keys.walkieTalkieToken -}}
{{- $githubKey := .Values.credentials.keys.githubToken -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $token := .Values.credentials.create.walkieTalkieToken -}}
{{- if not $token -}}
{{- if and $existing $existing.data (index $existing.data $tokenKey) -}}
{{- $token = index $existing.data $tokenKey | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
{{- $githubToken := .Values.credentials.create.githubToken -}}
{{- if not $githubToken -}}
{{- if and $existing $existing.data (index $existing.data $githubKey) -}}
{{- $githubToken = index $existing.data $githubKey | b64dec -}}
{{- end -}}
{{- end -}}
{{- $harness := dict -}}
{{- range $env, $value := .Values.credentials.create.harness -}}
{{- $_ := set $harness $env $value -}}
{{- end -}}
{{- if $existing -}}
{{- range $key, $value := $existing.data -}}
{{- if and (ne $key $tokenKey) (ne $key $githubKey) -}}
{{- if not (hasKey $harness $key) -}}
{{- $_ := set $harness $key ($value | b64dec) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "firstmate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $tokenKey }}: {{ $token | quote }}
  {{- if $githubToken }}
  {{ $githubKey }}: {{ $githubToken | quote }}
  {{- end }}
  {{- range $env := keys $harness | sortAlpha }}
  {{ $env }}: {{ index $harness $env | quote }}
  {{- end }}
{{- end }}
