{{- /* While the gateway's policies render, gateway-networkpolicy.yaml owns the */}}
{{- /* firstmate pod's policy; this one would let the Gateway bypass the gateway. */}}
{{- if and .Values.networkPolicy.enabled (not (and .Values.gateway.enabled .Values.gateway.networkPolicy.enabled)) }}
{{- $gwNs := include "firstmate.gatewayApiNamespace" . }}
{{- if not $gwNs }}
{{- fail "networkPolicy.enabled requires networkPolicy.gatewayNamespace or at least one httpRoute.parentRefs entry" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "firstmate.fullname" . }}
  labels:
    {{- include "firstmate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "firstmate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gwNs }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
