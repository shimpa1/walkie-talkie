{{- if .Values.networkPolicy.enabled }}
{{- $gwNs := .Values.networkPolicy.gatewayNamespace }}
{{- if not $gwNs }}
{{- if .Values.httpRoute.parentRefs }}
{{- $gwNs = (index .Values.httpRoute.parentRefs 0).namespace }}
{{- end }}
{{- end }}
{{- if not $gwNs }}
{{- fail "networkPolicy.enabled requires networkPolicy.gatewayNamespace or at least one httpRoute.parentRefs entry" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "firstmate.fullname" . }}
  labels:
    {{- include "firstmate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "firstmate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gwNs }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
